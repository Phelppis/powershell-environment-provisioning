name: PowerShell CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install test tooling
        shell: pwsh
        run: |
          Install-Module Pester -MinimumVersion 5.0 -Scope CurrentUser -Force -SkipPublisherCheck
      - name: Parse all PowerShell files
        shell: pwsh
        run: |
          $errors = @()
          Get-ChildItem -Recurse -Filter *.ps1 | ForEach-Object {
            $tokens = $null
            $parseErrors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$parseErrors)
            if ($null -ne $parseErrors -and $parseErrors.Count -gt 0) { $errors += @($parseErrors) }
          }
          Get-ChildItem -Recurse -Filter *.psm1 | ForEach-Object {
            $tokens = $null
            $parseErrors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$parseErrors)
            if ($null -ne $parseErrors -and $parseErrors.Count -gt 0) { $errors += @($parseErrors) }
          }
          if ($errors.Count -gt 0) { $errors | Format-List; throw 'PowerShell parsing failed.' }
      - name: Check public content for common secret patterns
        shell: pwsh
        run: ./scripts/Verify-PublicContent.ps1
      - name: Run Pester tests
        shell: pwsh
        run: |
          Import-Module Pester -MinimumVersion 5.0
          $result = Invoke-Pester -Path ./tests -PassThru -Output Detailed
          if ($result.FailedCount -gt 0) { exit 1 }
      - name: Smoke-test default paths (Windows PowerShell 5.1)
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          & ./Invoke-Provisioning.ps1 | Out-Null
          & ./Invoke-Provisioning.ps1 -Action IIS | Out-Null
          $steps = @(& ./gui/Start-Gui.ps1 -ValidateOnly)
          if ($steps.Count -eq 0) { throw 'No GUI preview steps were produced.' }
          if ('SQL Restore' -notin $steps.Stage -or 'IIS' -notin $steps.Stage) {
              throw 'Expected SQL Restore and IIS stages in the headless GUI preview.'
          }
          Write-Host "Windows PowerShell $($PSVersionTable.PSVersion): CLI and GUI preview passed."
